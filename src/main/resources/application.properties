# https://docs.spring.io/spring-boot/docs/1.5.9.RELEASE/reference/html/common-application-properties.html

#
# Application Name
spring.application.name=InCleanStudio
#
# View
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
#
# Messages Setting
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-seconds=-1
#
logging.level.org.springframework.security=WARN
#
# Logger
#    1. TRACE: The most detailed log, intended for debugging, outputting almost all events.
#    2. DEBUG: For debugging and flow verification during development.
#    3. INFO: General execution information, typically logged even in production environments.
#    4. WARN: Warning messages, conditions requiring attention.
#    5. ERROR: Critical issues such as error occurrences and exception handling.
#    6. FATAL: Not commonly used by Spring Boot itself, but fatal errors in some logging implementations.
#    7. OFF: Disables log output.
#logging.level.root=INFO
#logging.level.com.in=DEBUG
#
#logging.level.org.springframework=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
log4jdbc.dump.sql.select=true
log4jdbc.dump.sql.bind=true
log4jdbc.dump.sql.maxlinelength=-1
log4jdbc.trim.sql=false
#
# User Mfa Setting
user.mfa.use=N
user.mfa.fail.count=5
user.mfa.encryption.key=mySecretEncryptionKey1234567890
# User Mfa Backup Key Setting
user.mfa.backup.characters.key=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
user.mfa.backup.code.count=10
user.mfa.backup.code.length=12
# Mfa Authenticator setting url
user.mfa.android.google.url=https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2
user.mfa.android.microsoft.url=https://play.google.com/store/apps/details?id=com.azure.authenticator
user.mfa.ios.google.url=https://apps.apple.com/kr/app/google-authenticator/id388497605
user.mfa.ios.microsoft.url=https://apps.apple.com/kr/app/microsoft-authenticator/id983156458
#
# User Otp Setting(mail service)
user.otp.use=N
user.otp.fail.count=5
#
# OAuth2 - Google
oauth.google.client-id=455732733396-pi3uvmvcmlsv2j6ub60do8easo6hQogw.apps.googleusercontent.com
oauth.google.client-secret=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
oauth.google.redirect-uri=http://localhost:8080/api/oauth/callback/google
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
#
# OAuth2 - Kakao
oauth.kakao.client-id=your-kakao-client-id
oauth.kakao.client-secret=your-kakao-client-secret
oauth.kakao.redirect-uri=http://localhost:8080/oauth/callback/kakao
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
oauth.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
#
# OAuth2 - Naver
oauth.naver.client-id=your-naver-client-id
oauth.naver.client-secret=your-naver-client-secret
oauth.naver.redirect-uri=http://localhost:8080/oauth/callback/naver
oauth.naver.token-uri=https://nid.naver.com/oauth2.0/token
