#
# Error Page
# Whether to include exception contents in error responses
#server.error.include-exception=TRUE
# Whether to include stack trace contents in error responses (ALWAYS, NEVER, ON_TRACE_PARAM)
#server.error.include-stacktrace=ALWAYS
# Whether to use the default page displayed in server error cases for browser requests
#server.error.whitelabel.enabled=FALSE
#
# User First Password
user.first.password=12345678
#
# JWT Properties
jwt.secret=mySecretKey1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000
jwt.expirationMs=3600000
jwt.refresh-expiration=604800000
#
# MySQL Data Source Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/instudio?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/mzncvmc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
#
# JPA Properties
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#
# SQL 쿼리 출력
#spring.jpa.show-sql=true
#
# SQL 바인딩 파라미터까지 보기
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=trace
# 콘솔에 로그 레벨 DEBUG 설정
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
#
# MyBatis Properties
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.in.mzncvmc.domain
#
# Pagination Default Setting
app.pagination.default-page=0
app.pagination.default-size=10
#
# file upload setting
file.upload.base-path=/mzncvmc/uploads
file.upload.max-file-size=52428800
file.upload.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,hwp,zip
file.upload.blocked-extensions=exe,bat,cmd,com,pif,scr,vbs,js,jar,php,asp,jsp,sh
file.upload.virus-scan.enabled=false














spring.servlet.multipart.enabled=true
# 단일 파일 최대 크기 (50MB)
spring.servlet.multipart.max-file-size=50MB
# 전체 요청 최대 크기 (100MB)
spring.servlet.multipart.max-request-size=100MB
# 임시 파일 저장 위치
spring.servlet.multipart.location=/tmp
# 커스텀 파일 업로드 설정
# 기존 DB, Security 설정들 유지
#
# Ollama 설정
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma3
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.top-k=50
spring.ai.ollama.chat.options.top-p=0.9
# 타임아웃 설정 (선택사항)
spring.ai.ollama.chat.options.timeout=60s






























